<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Amaral, Full Stack Developer</title>
  <desc id="desc">Interface escura com uma sequência animada de inicialização do perfil.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B0D" />
      <stop offset="0.55" stop-color="#0A1113" />
      <stop offset="1" stop-color="#0B1718" />
    </linearGradient>
    <linearGradient id="accentLine" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36D1C4" stop-opacity="0" />
      <stop offset="0.18" stop-color="#36D1C4" />
      <stop offset="0.82" stop-color="#36D1C4" />
      <stop offset="1" stop-color="#36D1C4" stop-opacity="0" />
    </linearGradient>
    <clipPath id="frameClip">
      <rect x="20" y="20" width="1160" height="320" rx="18" />
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#surface)" />
  <rect x="20.5" y="20.5" width="1159" height="319" rx="17.5" stroke="#183B3B" />
  <path d="M42 76H1158" stroke="#183B3B" />
  <path d="M80 302H1120" stroke="url(#accentLine)" />

  <g clip-path="url(#frameClip)" opacity="0.16">
    <rect class="scan" x="20" y="-12" width="1160" height="2" fill="#36D1C4" />
  </g>

  <g font-family="JetBrains Mono, Consolas, monospace">
    <text x="48" y="55" fill="#718184" font-size="13" letter-spacing="2">SYSTEM INITIALIZATION</text>
    <text x="1152" y="55" text-anchor="end" fill="#36D1C4" font-size="13">ONLINE</text>

    <g class="identity">
      <text x="74" y="172" fill="#D7F7F4" font-size="48" font-weight="700" letter-spacing="1">GABRIEL AMARAL</text>
      <text x="77" y="211" fill="#36D1C4" font-size="18" letter-spacing="5">FULL STACK DEVELOPER</text>
      <text x="77" y="252" fill="#8FA1A4" font-size="15">interfaces  |  APIs  |  integrations  |  automation</text>
    </g>

    <g transform="translate(780 118)">
      <rect width="330" height="142" rx="12" fill="#0A1416" stroke="#183B3B" />
      <text class="boot boot-1" x="24" y="38" fill="#8FA1A4" font-size="14">[OK] identity.resolve()</text>
      <text class="boot boot-2" x="24" y="70" fill="#8FA1A4" font-size="14">[OK] modules.mount()</text>
      <text class="boot boot-3" x="24" y="102" fill="#8FA1A4" font-size="14">[OK] quality.verify()</text>
      <text class="boot boot-4" x="24" y="130" fill="#36D1C4" font-size="14">[READY] profile online</text>
    </g>

    <text x="48" y="326" fill="#526467" font-size="12">SÃO PAULO, BR</text>
    <text x="1152" y="326" text-anchor="end" fill="#526467" font-size="12">BUILDING RELIABLE DIGITAL PRODUCTS</text>
  </g>

  <style>
    .identity { animation: reveal 900ms cubic-bezier(.16,1,.3,1) both; }
    .boot { opacity: 0; animation: boot-in 500ms cubic-bezier(.16,1,.3,1) both; }
    .boot-1 { animation-delay: 300ms; }
    .boot-2 { animation-delay: 720ms; }
    .boot-3 { animation-delay: 1140ms; }
    .boot-4 { animation-delay: 1620ms; }
    .scan { animation: scan 4.8s ease-in-out infinite; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes boot-in {
      from { opacity: 0; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes scan {
      0%, 16% { transform: translateY(0); opacity: 0; }
      24% { opacity: .7; }
      72% { opacity: .28; }
      82%, 100% { transform: translateY(370px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .identity, .boot, .scan { animation: none; opacity: 1; transform: none; }
    }
  </style>
</svg>
